version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wolf_postgres
    restart: always
    environment:
      POSTGRES_USER: wolf_admin
      POSTGRES_PASSWORD: wolf_secure_pass_2026
      POSTGRES_DB: wolf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wolf_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: wolf_clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  qdrant:
    image: qdrant/qdrant:latest
    container_name: wolf_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  qdrant_data:
